name: Pull request title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title used by release automation
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'JS'
          const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+/;
          if (!pattern.test(process.env.PR_TITLE)) {
            console.error('Use a Conventional Commit title, for example: fix: show connection errors');
            process.exit(1);
          }
          JS
