name: Pull request title

# GoReleaser groups the release notes by the Conventional Commit type of each
# commit subject on main. Squash-merging makes the PR title that subject, so a
# title it cannot parse lands under "Others" instead of Features or Bug fixes,
# and a breaking change goes unflagged. Checking the title is cheaper than
# editing the release notes afterwards.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title used by release automation
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'JS'
          const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+/;
          const title = process.env.PR_TITLE ?? '';
          if (pattern.test(title)) process.exit(0);
          console.error(`This title cannot be grouped in the release notes:\n\n  ${title}\n`);
          // The colon is what gets left out: "feat(gui) AME-1234 ..." looks
          // conventional and parses as nothing.
          console.error('Use "<type>(<scope>): <summary>", for example:\n');
          console.error('  fix(gui): show connection errors');
          console.error('  feat(gui): AME-1234 add a playroom filter');
          console.error('  chore(deps): bump wails to beta.12\n');
          console.error('Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert.');
          console.error('The colon after the type (and optional scope) is required.');
          process.exit(1);
          JS
