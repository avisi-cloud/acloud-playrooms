name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or retry (for example v0.28.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag and Homebrew credentials
        env:
          HOMEBREW_TOOLS_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TOOLS_GITHUB_TOKEN }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable release tag such as v0.28.1.' >&2
            exit 1
          fi
          if [ -z "$HOMEBREW_TOOLS_GITHUB_TOKEN" ]; then
            echo 'Set HOMEBREW_TOOLS_GITHUB_TOKEN as described in doc/RELEASING.md.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make check
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/generate-homebrew-cask.mjs
      - run: bash scripts/verify-release.sh
      - name: Check generated bindings are committed
        run: git diff --exit-code -- frontend/bindings
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" dist/*.zip dist/checksums.txt dist/homebrew/acloud-playrooms.rb --clobber
      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: avisi-cloud/homebrew-tools
          token: ${{ secrets.HOMEBREW_TOOLS_GITHUB_TOKEN }}
          path: homebrew-tools
      - name: Update Homebrew cask
        run: |
          mkdir -p homebrew-tools/Casks
          cp dist/homebrew/acloud-playrooms.rb homebrew-tools/Casks/acloud-playrooms.rb
          git -C homebrew-tools config user.name 'github-actions[bot]'
          git -C homebrew-tools config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C homebrew-tools add Casks/acloud-playrooms.rb
          if ! git -C homebrew-tools diff --cached --quiet; then
            git -C homebrew-tools commit -m "chore: update acloud-playrooms to $RELEASE_TAG"
            git -C homebrew-tools push
          fi
