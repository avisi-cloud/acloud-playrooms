name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or retry (for example v0.29.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable release tag such as v0.29.2.' >&2
            exit 1
          fi
      # Fail before building rather than after the GitHub release is published.
      - name: Validate Homebrew token
        env:
          HOMEBREW_TOOLS_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TOOLS_GITHUB_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TOOLS_GITHUB_TOKEN" ]; then
            echo 'The HOMEBREW_TOOLS_GITHUB_TOKEN secret is not configured; see doc/RELEASING.md.' >&2
            exit 1
          fi
          curl -fsS -o /dev/null \
            -H "Authorization: token $HOMEBREW_TOOLS_GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/homebrew-tools"
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make check
      - name: Install DMG packaging tool
        run: brew install create-dmg
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Builds, verifies and publishes the app, DMG, checksums and release notes.
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
      - run: node scripts/generate-homebrew-cask.mjs
      - run: bash scripts/verify-release.sh
      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-tools
          token: ${{ secrets.HOMEBREW_TOOLS_GITHUB_TOKEN }}
          path: homebrew-tools
      - name: Update Homebrew cask
        run: |
          mkdir -p homebrew-tools/Casks
          cp dist/homebrew/acloud-playrooms.rb homebrew-tools/Casks/acloud-playrooms.rb
          git -C homebrew-tools config user.name 'github-actions[bot]'
          git -C homebrew-tools config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C homebrew-tools add Casks/acloud-playrooms.rb
          if ! git -C homebrew-tools diff --cached --quiet; then
            git -C homebrew-tools commit -m "chore: update acloud-playrooms to $RELEASE_TAG"
            git -C homebrew-tools push
          fi
