version: 0.28.2
info:
  companyName: Avisi
  productName: Acloud Playrooms
  productIdentifier: nl.avisi.acloud-playrooms
  description: Acloud Playrooms
  copyright: (c) 2026, Avisi
  comments: Acloud Playrooms
  version: 0.28.0
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - '*_test.go'
    watched_extension:
      - '*.go'
      - '*.js'
      - '*.ts'
    git_ignore: true
  executes:
    - cmd: wails3 task build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend:serve
      type: background
    - cmd: wails3 task run
      type: primary
fileAssociations: null
other:
  - name: My Other Data
