<div [class.repeat-group]="grouped">
  @if (showHeader) {
    <div class="repeat-group-head">
      <div class="repeat-label">{{ label }}</div>
      <span class="repeat-count">{{ filledValueCount() }}</span>
    </div>
  }
  @for (value of values(); track $index) {
    <div class="repeat-row">
      <input
        [attr.aria-label]="itemLabel + ' ' + ($index + 1)"
        pInputText
        class="flex-1"
        [ngModel]="value"
        (ngModelChange)="replaceValueAt($index, $event)"
        (paste)="pasteLinesAt($index, $event)"
        [attr.aria-describedby]="
          (hint ? suggestionListId + '-hint ' : '') +
            (itemErrors[$index] || itemHints[$index] ? suggestionListId + '-row-' + $index : '') ||
          null
        "
        [attr.aria-invalid]="itemErrors[$index] ? true : null"
        [attr.list]="suggestions.length ? suggestionListId : null"
        [placeholder]="placeholder"
      />
      <p-button
        icon="pi pi-times"
        severity="danger"
        [text]="true"
        size="small"
        [ariaLabel]="'Remove ' + itemLabel + ' ' + ($index + 1)"
        (click)="removeValueAt($index)"
      />
    </div>
    @if (itemErrors[$index] || itemHints[$index]; as text) {
      <small
        [id]="suggestionListId + '-row-' + $index"
        class="field-hint"
        [class.error]="itemErrors[$index]"
        aria-live="polite"
        [attr.role]="itemErrors[$index] ? 'alert' : null"
        >{{ text }}</small
      >
    }
  }
  @if (suggestions.length) {
    <datalist [id]="suggestionListId">
      @for (suggestion of suggestions; track suggestion) {
        <option [value]="suggestion"></option>
      }
    </datalist>
  }
  <p-button
    [label]="'+ ' + addLabel"
    severity="secondary"
    [text]="true"
    size="small"
    (click)="addBlankRow()"
  />
  @if (hint) {
    <small class="field-hint" [id]="suggestionListId + '-hint'">{{ hint }}</small>
  }
</div>
