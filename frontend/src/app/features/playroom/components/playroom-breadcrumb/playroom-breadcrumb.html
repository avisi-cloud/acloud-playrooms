<nav aria-label="Breadcrumb">
  <ol>
    <li>
      <span
        class="breadcrumb-name"
        tabindex="0"
        [pTooltip]="scope.currentOrganisation() || 'Not reported'"
        tooltipEvent="both"
        >{{ scope.currentOrganisation() || 'Not reported' }}</span
      >
    </li>
    <li>
      <i class="pi pi-angle-right" aria-hidden="true"></i>
      <button
        type="button"
        class="breadcrumb-name playhouse-button"
        [attr.aria-label]="'Choose playhouse: ' + (state.playhouse() || 'Not reported')"
        aria-haspopup="dialog"
        [attr.aria-expanded]="showPlayhouseChooser"
        [attr.aria-current]="roomName ? null : 'page'"
        [pTooltip]="state.playhouse() || 'Not reported'"
        tooltipEvent="both"
        (click)="showPlayhouseChooser = true"
      >
        {{ state.playhouse() || 'Not reported' }}
      </button>
    </li>
    @if (roomName) {
      <li>
        <i class="pi pi-angle-right" aria-hidden="true"></i>
        <span
          class="breadcrumb-name"
          tabindex="0"
          aria-current="page"
          [pTooltip]="roomName"
          tooltipEvent="both"
          >{{ roomName }}</span
        >
      </li>
    }
  </ol>
</nav>

@defer (when showPlayhouseChooser) {
  <app-playhouse-chooser [(visible)]="showPlayhouseChooser" />
}
